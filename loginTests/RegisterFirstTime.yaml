appId: estudify.develop

# --- MAESTRO ENV START ---
env:
  NOME: "Maestro teste"
  EMAIL: "maestro@email.com"
  NASCIMENTO: "01/01/2001"
  TELEFONE: "11987654321"
  SENHA: "Maestro123"
# --- MAESTRO ENV END ---


config:
  ext:
    actionTimeout: 500




---
- runFlow: "FirstAccessAppSkip.yaml"
- tapOn: "Registrar"
- tapOn: "Ex: Maria dos Santos"
- inputText: ${NOME}
- tapOn: "abc@abc.com"
- inputText: ${EMAIL}
- tapOn: "DD/MM/AAAA"
- inputText: ${NASCIMENTO}
- tapOn: "(11) 99999-9999"
- inputText: ${TELEFONE}
- scroll
- tapOn:
    below: "Senha"
- inputText: ${SENHA}
- tapOn:
    rightOf: "Senha"
- tapOn:
    below: "Confirmar Senha"
- inputText: ${SENHA}
- tapOn:
    rightOf: "Confirmar Senha"
- tapOn: "Confirmar"
- tapOn:
    text: "Never for this app or website"
    optional: true
